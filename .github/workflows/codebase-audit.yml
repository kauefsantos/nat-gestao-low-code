name: Temporary codebase audit

on:
  push:
    branches: [chore/codebase-github-polish]
    paths:
      - .github/workflows/codebase-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unused code and dependencies
        continue-on-error: true
        run: npx --yes knip --reporter compact
      - name: Duplication scan
        continue-on-error: true
        run: npx --yes jscpd src --min-lines 8 --min-tokens 70 --reporters console
      - name: Existing project checks
        run: npm run check
