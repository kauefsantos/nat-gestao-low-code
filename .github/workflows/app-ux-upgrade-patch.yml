name: One-time application UX upgrade

# Final persistence pass: workflow files are managed separately through GitHub.
on:
  push:
    branches: [product-ux-daily-ops]
    paths:
      - .github/workflows/app-ux-upgrade-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: product-ux-daily-ops
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Patch application integration points
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected fragment not found in {path}: {old[:100]}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace('src/components/nat/Views.tsx',
            'export function HomeView({ state,numbers,onSale,onSupplies,onProducts,onPricing }: { state: NatState; numbers: ReturnType<typeof dashboardNumbers>; onSale:()=>void; onSupplies:()=>void; onProducts:()=>void; onPricing:()=>void }) {',
            'export function HomeView({ state,numbers,onSale,onSupplies,onProducts,onPricing,showOnboarding=true }: { state: NatState; numbers: ReturnType<typeof dashboardNumbers>; onSale:()=>void; onSupplies:()=>void; onProducts:()=>void; onPricing:()=>void; showOnboarding?:boolean }) {')
          replace('src/components/nat/Views.tsx','{completed<3 && <div className="rounded-[28px] bg-chocolate','{showOnboarding&&completed<3 && <div className="rounded-[28px] bg-chocolate')

          replace('src/app/NatApp.tsx','import { useMemo, useState } from "react";','import { useEffect, useMemo, useState } from "react";')
          replace('src/app/NatApp.tsx','import { useInventory } from "@/hooks/use-inventory";','import { useInventory } from "@/hooks/use-inventory";\nimport { useCalendar } from "@/hooks/use-calendar";')
          replace('src/app/NatApp.tsx','import { dashboardNumbers, type Product, type Settings, type SporadicExpense, type Supply } from "@/domain/nat";','import { dashboardNumbers, id, type Product, type Settings, type SporadicExpense, type Supply } from "@/domain/nat";')
          replace('src/app/NatApp.tsx','import { HomeView, PricingView } from "@/components/nat/Views";','import { HomeView, PricingView } from "@/components/nat/Views";\nimport { HomeOperations } from "@/components/nat/HomeOperations";')
          replace('src/app/NatApp.tsx','import { ExpenseSheet, ProductSheet, SettingsSheet } from "@/components/nat/Sheets";','import { ExpenseSheet, ProductSheet, SettingsSheet } from "@/components/nat/Sheets";\nimport { installGlobalDiagnostics, recordDiagnostic } from "@/lib/telemetry";')
          replace('src/app/NatApp.tsx','  const inventory=useInventory(businessId,syncRevision);','  const inventory=useInventory(businessId,syncRevision);\n  const homeCalendar=useCalendar(view==="home");')
          replace('src/app/NatApp.tsx','  const numbers=useMemo(()=>dashboardNumbers(state),[state]);','  const numbers=useMemo(()=>dashboardNumbers(state),[state]);\n  useEffect(()=>installGlobalDiagnostics(),[]);\n  useEffect(()=>{if(loadError)recordDiagnostic(`Falha ao carregar dados: ${loadError}`);},[loadError]);')
          replace('src/app/NatApp.tsx','    {view==="home"&&<HomeView state={homeState} numbers={numbers} onSale={()=>setSheet({type:"sale"})} onSupplies={()=>openProducts("supplies")} onProducts={()=>openProducts("products")} onPricing={()=>onView("pricing")}/>} ',
            '    {view==="home"&&<div className="space-y-6"><HomeOperations state={homeState} events={homeCalendar.events} inventory={inventory.snapshot} onSale={()=>setSheet({type:"sale"})} onSupplies={()=>openProducts("supplies")} onProducts={()=>openProducts("products")} onPricing={()=>onView("pricing")} onCalendar={()=>onView("calendar")} onInventory={()=>onView("inventory")}/><HomeView state={homeState} numbers={numbers} onSale={()=>setSheet({type:"sale"})} onSupplies={()=>openProducts("supplies")} onProducts={()=>openProducts("products")} onPricing={()=>onView("pricing")} showOnboarding={false}/></div>} ')
          replace('src/app/NatApp.tsx','onDeleteProduct={(productId)=>update((current)=>({...current,products:current.products.filter((product)=>product.id!==productId)}))}',
            'onDuplicateProduct={(product)=>update((current)=>({...current,products:[...current.products,{...product,id:id("product"),name:`${product.name} (cópia)`,portfolioKey:null,available:true}]}))} onDeleteProduct={(productId)=>update((current)=>({...current,products:current.products.filter((product)=>product.id!==productId)}))}')
          replace('src/app/NatApp.tsx','{sheet?.type==="supply"&&<SupplySheet value={sheet.value} preset={sheet.preset}',
            '{sheet?.type==="supply"&&<SupplySheet value={sheet.value} preset={sheet.preset} recentSupplies={state.supplies}')

          replace('src/components/nat/SupplySheet.tsx','export function SupplySheet({value,preset,onClose,onSave}:{value?:Supply;preset?:StarterSupply;onClose:()=>void;onSave:(supply:Supply)=>void}) {',
            'export function SupplySheet({value,preset,recentSupplies=[],onClose,onSave}:{value?:Supply;preset?:StarterSupply;recentSupplies?:Supply[];onClose:()=>void;onSave:(supply:Supply)=>void}) {')
          replace('src/components/nat/SupplySheet.tsx','  const panelRef=useDialogA11y<HTMLDivElement>({onClose});',
            '  const panelRef=useDialogA11y<HTMLDivElement>({onClose});\n  const latestPurchase=!value&&!preset?recentSupplies[0]:undefined;\n  const repeatLatest=()=>{if(!latestPurchase)return;setName(latestPurchase.name);setCategory(latestPurchase.category);setQuantity(String(latestPurchase.packageQuantity));setUnit(latestPurchase.packageUnit);setPrice(String(latestPurchase.packagePrice).replace(".",","));setDate(new Date().toISOString().slice(0,10));};')
          replace('src/components/nat/SupplySheet.tsx','      <form className="mt-7 space-y-5" onSubmit={submit}>',
            '      <form className="mt-7 space-y-5" onSubmit={submit}>{latestPurchase&&<button type="button" className="secondary-button w-full justify-center" onClick={repeatLatest}>Repetir última compra: {latestPurchase.name}</button>}')

          replace('src/components/nat/ProductsView.tsx','import { Plus, Trash2 } from "lucide-react";','import { Copy, Plus, Trash2 } from "lucide-react";')
          replace('src/components/nat/ProductsView.tsx','onNewProduct,onEditProduct,onDeleteProduct,onNewExpense', 'onNewProduct,onEditProduct,onDuplicateProduct,onDeleteProduct,onNewExpense')
          replace('src/components/nat/ProductsView.tsx','onEditProduct:(p:Product)=>void;onDeleteProduct:(id:string)=>void;', 'onEditProduct:(p:Product)=>void;onDuplicateProduct:(p:Product)=>void;onDeleteProduct:(id:string)=>void;')
          replace('src/components/nat/ProductsView.tsx','<Products state={state} onNew={onNewProduct} onEdit={onEditProduct} onDelete=', '<Products state={state} onNew={onNewProduct} onEdit={onEditProduct} onDuplicate={onDuplicateProduct} onDelete=')
          replace('src/components/nat/ProductsView.tsx','function Family({title,items,state,onNew,onEdit}:{title:string;items:CatalogItem[];state:NatState;onNew:(preset?:CatalogItem)=>void;onEdit:(product:Product)=>void})',
            'function Family({title,items,state,onNew,onEdit,onDuplicate}:{title:string;items:CatalogItem[];state:NatState;onNew:(preset?:CatalogItem)=>void;onEdit:(product:Product)=>void;onDuplicate:(product:Product)=>void})')
          replace('src/components/nat/ProductsView.tsx','<button type="button" className="secondary-button mt-4 w-full justify-center" onClick={()=>product?onEdit(product):onNew(item)}>{product?"Editar":"Configurar receita"}</button>',
            '<div className="mt-4 grid gap-2 sm:grid-cols-2"><button type="button" className="secondary-button w-full justify-center" onClick={()=>product?onEdit(product):onNew(item)}>{product?"Editar":"Configurar receita"}</button>{product&&<button type="button" className="secondary-button w-full justify-center" onClick={()=>onDuplicate(product)}><Copy size={15}/> Duplicar</button>}</div>')
          replace('src/components/nat/ProductsView.tsx','function Products({state,onNew,onEdit,onDelete}:{state:NatState;onNew:(preset?:CatalogItem)=>void;onEdit:(p:Product)=>void;onDelete:(p:Product)=>void})',
            'function Products({state,onNew,onEdit,onDuplicate,onDelete}:{state:NatState;onNew:(preset?:CatalogItem)=>void;onEdit:(p:Product)=>void;onDuplicate:(p:Product)=>void;onDelete:(p:Product)=>void})')
          replace('src/components/nat/ProductsView.tsx','<Family title="Brownies" items={BROWNIE_CATALOG} state={state} onNew={onNew} onEdit={onEdit}/><Family title="Brigadeiros" items={BRIGADEIRO_CATALOG} state={state} onNew={onNew} onEdit={onEdit}/>',
            '<Family title="Brownies" items={BROWNIE_CATALOG} state={state} onNew={onNew} onEdit={onEdit} onDuplicate={onDuplicate}/><Family title="Brigadeiros" items={BRIGADEIRO_CATALOG} state={state} onNew={onNew} onEdit={onEdit} onDuplicate={onDuplicate}/>')
          replace('src/components/nat/ProductsView.tsx','<button type="button" className="icon-button" onClick={()=>onDelete(product)} aria-label={`Arquivar ${product.name}`}><Trash2 size={16}/></button>',
            '<button type="button" className="icon-button" onClick={()=>onDuplicate(product)} aria-label={`Duplicar ${product.name}`}><Copy size={16}/></button><button type="button" className="icon-button" onClick={()=>onDelete(product)} aria-label={`Arquivar ${product.name}`}><Trash2 size={16}/></button>')
          PY
      - name: Add mobile browser regression files
        shell: bash
        run: |
          npm install --save-dev @playwright/test@1.55.0 --ignore-scripts --no-audit --no-fund
          node <<'NODE'
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.scripts['test:mobile']='playwright test e2e/mobile.spec.ts';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          NODE
          mkdir -p e2e
          cat > playwright.config.ts <<'EOF'
          import { defineConfig, devices } from "@playwright/test";
          export default defineConfig({
            testDir: "./e2e",
            timeout: 30_000,
            retries: 1,
            use: { baseURL: "http://127.0.0.1:4173", trace: "retain-on-failure" },
            projects: [{ name: "iphone", use: { ...devices["iPhone 13"] } }],
            webServer: { command: "npm run dev -- --host 127.0.0.1 --port 4173", url: "http://127.0.0.1:4173/login", reuseExistingServer: false, timeout: 120_000 },
          });
          EOF
          cat > e2e/mobile.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";
          for (const path of ["/login", "/signup"]) {
            test(`${path} cabe em uma tela de iPhone sem zoom ou rolagem lateral`, async ({ page }) => {
              await page.goto(path);
              await expect(page.locator("body")).toBeVisible();
              const layout = await page.evaluate(() => ({ width: window.innerWidth, scrollWidth: document.documentElement.scrollWidth }));
              expect(layout.scrollWidth).toBeLessThanOrEqual(layout.width + 1);
              const fields = page.locator("input:visible");
              for (let index = 0; index < await fields.count(); index += 1) {
                const fontSize = await fields.nth(index).evaluate((element) => Number.parseFloat(getComputedStyle(element).fontSize));
                expect(fontSize).toBeGreaterThanOrEqual(16);
              }
              const submit = page.locator('button[type="submit"]:visible').first();
              if (await submit.count()) {
                const box = await submit.boundingBox();
                expect(box?.height ?? 0).toBeGreaterThanOrEqual(44);
              }
            });
          }
          EOF
      - name: Validate before commit
        run: npm run check
      - name: Commit feature changes
        shell: bash
        run: |
          git config user.name 'Kauê Pastrello'
          git config user.email '120512459+kauefsantos@users.noreply.github.com'
          git add src package.json package-lock.json e2e playwright.config.ts
          git commit -m 'feat: improve daily operations UX, exports and observability'
          git push origin HEAD:product-ux-daily-ops
