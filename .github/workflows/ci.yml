name: Validate NAT Gestão

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run security:static
      - run: npm run test:domain
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit complete dependency tree for critical issues
        run: npm audit --audit-level=critical

  database-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Start disposable Supabase stack
        run: npx --yes supabase@2.117.0 start -x studio,imgproxy,mailpit,logflare,vector
      - name: Rebuild database from migrations
        run: npx --yes supabase@2.117.0 db reset
      - name: Run RLS and integrity regression tests
        run: npx --yes supabase@2.117.0 test db
      - name: Lint database schema
        run: npx --yes supabase@2.117.0 db lint --level warning
