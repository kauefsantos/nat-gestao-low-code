name: Validate NAT Gestão

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.5
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Check architecture boundaries
        run: npm run architecture:check
      - run: npm run security:static
      - run: npm run security:privacy
      - name: Typecheck Edge Functions
        run: deno check --config supabase/functions/deno.json supabase/functions/nat-content-ai/index.ts supabase/functions/nat-push-dispatch/index.ts supabase/functions/nat-inventory-production/index.ts
      - name: Lint Edge Functions
        run: deno lint --config supabase/functions/deno.json supabase/functions
      - run: npm run test:domain
      - run: npm run build
      - name: Enforce performance budget
        run: npm run perf:budget
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Audit complete dependency tree for high or critical issues
        run: npm audit --audit-level=high
      - name: Require successful Mobile E2E for pull requests
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          for attempt in $(seq 1 80); do
            RESULT="$(gh run list --workflow 'Mobile E2E' --commit "$HEAD_SHA" --event pull_request --limit 5 --json status,conclusion,databaseId --jq 'sort_by(.databaseId) | last // {}')"
            STATUS="$(jq -r '.status // "missing"' <<<"$RESULT")"
            CONCLUSION="$(jq -r '.conclusion // ""' <<<"$RESULT")"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Mobile E2E concluído com sucesso."
                exit 0
              fi
              echo "Mobile E2E terminou com conclusão: $CONCLUSION"
              exit 1
            fi
            echo "Aguardando Mobile E2E ($STATUS), tentativa $attempt/80..."
            sleep 10
          done
          echo "Mobile E2E não concluiu dentro do tempo esperado."
          exit 1

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Start disposable Supabase stack
        run: npx --yes supabase@2.117.0 start -x studio,imgproxy,mailpit,logflare,vector
      - name: Rebuild database from migrations
        run: npx --yes supabase@2.117.0 db reset
      - name: Align disposable database with business timezone
        shell: bash
        run: |
          source <(npx --yes supabase@2.117.0 status -o env)
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "alter database postgres set timezone to 'America/Sao_Paulo';"
      - name: Run RLS and integrity regression tests
        run: npx --yes supabase@2.117.0 test db
      - name: Lint database schema
        run: npx --yes supabase@2.117.0 db lint --level warning
