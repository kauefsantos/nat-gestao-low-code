name: Validate NAT Gestão

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # O lockfile veio defasado da base remixada. `npm install` resolve a árvore
      # antes da validação sem depender de alterações no ambiente do Lovable.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
