name: Mobile E2E

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install accessibility test helper
        run: npm install --no-save --package-lock=false @axe-core/playwright@4.13.0
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Start disposable Supabase stack
        run: npx --yes supabase@2.117.0 start -x studio,imgproxy,mailpit,logflare,vector
      - name: Rebuild database from migrations
        run: npx --yes supabase@2.117.0 db reset
      - name: Run public responsive and browser matrix
        shell: bash
        run: |
          source <(npx --yes supabase@2.117.0 status -o env)
          CLIENT_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$CLIENT_KEY" npm run test:mobile
      - name: Run public WCAG 2.2 AA Axe checks
        shell: bash
        run: |
          source <(npx --yes supabase@2.117.0 status -o env)
          CLIENT_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$CLIENT_KEY" npx playwright test e2e/accessibility-public.spec.ts --project=desktop-chromium --project=mobile-webkit

  authorization-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start disposable Supabase stack
        run: npx --yes supabase@2.117.0 start -x studio,imgproxy,mailpit,logflare,vector
      - name: Rebuild database from migrations
        run: npx --yes supabase@2.117.0 db reset
      - name: Seed isolated authorization tenants and confirmed users
        shell: bash
        run: |
          source <(npx --yes supabase@2.117.0 status -o env)
          psql "$DB_URL" <<'SQL'
          insert into public.businesses(id,name) values
            ('a1000000-0000-4000-8000-000000000001','RLS E2E Tenant A'),
            ('a1000000-0000-4000-8000-000000000002','RLS E2E Tenant B');
          insert into public.business_settings(business_id,owner_name) values
            ('a1000000-0000-4000-8000-000000000001','Tenant A'),
            ('a1000000-0000-4000-8000-000000000002','Tenant B');
          insert into private.allowed_auth_emails(email,business_id,role) values
            ('rls-admin-a@example.test','a1000000-0000-4000-8000-000000000001','admin'),
            ('rls-admin-b@example.test','a1000000-0000-4000-8000-000000000002','admin'),
            ('responsive@example.test','a1000000-0000-4000-8000-000000000001','admin'),
            ('operations@example.test','a1000000-0000-4000-8000-000000000001','admin');
          insert into public.supplies(id,business_id,name,category,active) values
            ('a3000000-0000-4000-8000-000000000001','a1000000-0000-4000-8000-000000000001','ONLY TENANT A','ingredient',true),
            ('a3000000-0000-4000-8000-000000000002','a1000000-0000-4000-8000-000000000002','ONLY TENANT B','ingredient',true);
          insert into public.supply_purchases(id,business_id,supply_id,package_quantity,package_unit,package_price,purchased_at,funding_source)
          values('a4000000-0000-4000-8000-000000000001','a1000000-0000-4000-8000-000000000001','a3000000-0000-4000-8000-000000000001',100,'g',10,current_date,'owner');
          insert into public.products(id,business_id,name,batch_yield,selling_price,loss_percent,labor_cost_per_batch,production_cost_per_batch,minimum_margin_percent,target_margin_percent,active,available)
          values('a5000000-0000-4000-8000-000000000001','a1000000-0000-4000-8000-000000000001','Produto E2E Venda',10,5,0,0,0,10,20,true,true);
          insert into public.recipe_items(id,business_id,product_id,supply_id,quantity,unit)
          values('a6000000-0000-4000-8000-000000000001','a1000000-0000-4000-8000-000000000001','a5000000-0000-4000-8000-000000000001','a3000000-0000-4000-8000-000000000001',100,'g');
          SQL
          ADMIN_KEY="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          test -n "$ADMIN_KEY"
          for EMAIL in rls-admin-a@example.test rls-admin-b@example.test responsive@example.test operations@example.test; do
            curl --fail-with-body --silent --show-error \
              -X POST "$API_URL/auth/v1/admin/users" \
              -H "apikey: $ADMIN_KEY" \
              -H "Authorization: Bearer $ADMIN_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"$EMAIL\",\"password\":\"NAT-RLS-e2e-2026!\",\"email_confirm\":true}" >/dev/null
          done
      - name: Run real MFA and cross-tenant authorization E2E
        shell: bash
        run: |
          source <(npx --yes supabase@2.117.0 status -o env)
          CLIENT_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$CLIENT_KEY" npx playwright test e2e/authorization.spec.ts --project=desktop-chromium
      - name: Run authenticated responsive E2E
        shell: bash
        run: |
          source <(npx --yes supabase@2.117.0 status -o env)
          CLIENT_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$CLIENT_KEY" npx playwright test e2e/responsive-authenticated.spec.ts --project=mobile-chromium
      - name: Run operational sale lifecycle E2E
        shell: bash
        run: |
          source <(npx --yes supabase@2.117.0 status -o env)
          CLIENT_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$CLIENT_KEY" npx playwright test e2e/operational-sale.spec.ts --project=desktop-chromium
