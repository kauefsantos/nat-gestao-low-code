name: Mobile E2E

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile

  authorization-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Start disposable Supabase stack
        run: npx --yes supabase@2.117.0 start -x studio,imgproxy,mailpit,logflare,vector
      - name: Rebuild database from migrations
        run: npx --yes supabase@2.117.0 db reset
      - name: Seed isolated authorization tenants and confirmed users
        shell: bash
        run: |
          source <(npx --yes supabase@2.117.0 status -o env)
          psql "$DB_URL" <<'SQL'
          insert into public.businesses(id,name) values
            ('a1000000-0000-4000-8000-000000000001','RLS E2E Tenant A'),
            ('a1000000-0000-4000-8000-000000000002','RLS E2E Tenant B');
          insert into public.business_settings(business_id,owner_name) values
            ('a1000000-0000-4000-8000-000000000001','Tenant A'),
            ('a1000000-0000-4000-8000-000000000002','Tenant B');
          insert into private.allowed_auth_emails(email,business_id,role) values
            ('rls-admin-a@example.test','a1000000-0000-4000-8000-000000000001','admin'),
            ('rls-admin-b@example.test','a1000000-0000-4000-8000-000000000002','admin');
          insert into public.supplies(id,business_id,name,category,active) values
            ('a3000000-0000-4000-8000-000000000001','a1000000-0000-4000-8000-000000000001','ONLY TENANT A','ingredient',true),
            ('a3000000-0000-4000-8000-000000000002','a1000000-0000-4000-8000-000000000002','ONLY TENANT B','ingredient',true);
          SQL
          ADMIN_KEY="${SECRET_KEY:-${SERVICE_ROLE_KEY:-}}"
          test -n "$ADMIN_KEY"
          for EMAIL in rls-admin-a@example.test rls-admin-b@example.test; do
            curl --fail-with-body --silent --show-error \
              -X POST "$API_URL/auth/v1/admin/users" \
              -H "apikey: $ADMIN_KEY" \
              -H "Authorization: Bearer $ADMIN_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"$EMAIL\",\"password\":\"NAT-RLS-e2e-2026!\",\"email_confirm\":true}" >/dev/null
          done
      - name: Run real MFA and cross-tenant authorization E2E
        shell: bash
        run: |
          source <(npx --yes supabase@2.117.0 status -o env)
          CLIENT_KEY="${PUBLISHABLE_KEY:-$ANON_KEY}"
          VITE_SUPABASE_URL="$API_URL" VITE_SUPABASE_PUBLISHABLE_KEY="$CLIENT_KEY" npx playwright test e2e/authorization.spec.ts
