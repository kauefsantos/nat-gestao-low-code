name: Temporary repository polish

on:
  push:
    branches: [chore/codebase-github-polish]
    paths:
      - .github/workflows/repo-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/codebase-github-polish
          fetch-depth: 0
      - name: Refresh public documentation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected fragment not found in {path}: {old[:120]}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace('README.md',
            '![CI](https://img.shields.io/badge/CI-Validated-2EA44F?style=flat-square&logo=githubactions&logoColor=white)',
            '[![CI](https://github.com/kauefsantos/nat-gestao-low-code/actions/workflows/ci.yml/badge.svg?branch=main)](https://github.com/kauefsantos/nat-gestao-low-code/actions/workflows/ci.yml)')
          replace('README.md',
            '[**Ver o case em 2 minutos**](docs/PORTFOLIO.md) · [**Case Study**](docs/CASE_STUDY.md) · [**Arquitetura**](docs/ARCHITECTURE.md) · [**Documentação**](docs/README.md)',
            '[**Abrir aplicação**](https://nat-gestao.lovable.app/) · [**Ver o case em 2 minutos**](docs/PORTFOLIO.md) · [**Case Study**](docs/CASE_STUDY.md) · [**Arquitetura**](docs/ARCHITECTURE.md) · [**Documentação**](docs/README.md)')
          replace('README.md',
            '| **Problema** | custos, preços, vendas, estoque e rotina operacional estavam conectados, mas sem uma visão única |',
            '| **Problema** | custos, preços, vendas, estoque e rotina operacional estavam desconectados e sem uma visão única |')
          replace('README.md',
            '| **Qualidade** | ESLint, TypeScript, Node Test Runner, pgTAP, GitHub Actions |',
            '| **Qualidade** | ESLint, TypeScript, Node Test Runner, Playwright, pgTAP, GitHub Actions |')
          replace('README.md',
            '→ build\n→ auditoria de dependências',
            '→ build\n→ mobile E2E em PR (viewport touch)\n→ auditoria de dependências')
          governance = '''## Governança do repositório\n\nA `main` é protegida por ruleset ativo: mudanças entram por **Pull Request**, passam pelos checks `validate` e `database-security` e são integradas por **squash merge**. Force push e exclusão da branch principal ficam bloqueados. O repositório também mantém `CODEOWNERS`, Dependabot e regressão mobile automática em PRs.\n\n---\n\n'''
          replace('README.md', '## Desenvolvimento local\n', governance + '## Desenvolvimento local\n')

          # Project state: reflect the current product/CI/repository state.
          replace('PROJECT_STATE.md',
            '- `src/domain/calendar.ts`, `src/hooks/use-calendar.ts`, `src/components/nat/CalendarView.tsx`: agenda e lembretes.\n',
            '- `src/domain/calendar.ts`, `src/hooks/use-calendar.ts`, `src/components/nat/CalendarView.tsx`: agenda e lembretes.\n- `src/domain/insights.ts` e `src/components/nat/HomeOperations.tsx`: Central do Dia, onboarding e relatórios com amostra mínima.\n- `src/lib/export-data.ts`: exportação CSV e backup estruturado em JSON.\n- `src/lib/telemetry.ts`: diagnóstico técnico local, sem enviar dados comerciais a terceiros.\n')
          replace('PROJECT_STATE.md',
            '- Barra mobile fixa: **Início, Vendas, Agenda, Estoque e Mais**.\n',
            '- Barra mobile fixa: **Início, Vendas, Agenda, Estoque e Mais**.\n- Regressão Playwright em viewport touch valida login/cadastro contra overflow horizontal, zoom indevido de inputs e alvos de toque pequenos.\n')
          replace('PROJECT_STATE.md',
            '13. Estoque opt-in com produção, mínimos, alertas e ledger.\n',
            '13. Estoque opt-in com produção, mínimos, alertas e ledger.\n14. Onboarding guiado: compra → receita → preço → primeira venda.\n15. Central do Dia com vendas, sobra, agenda, estoque baixo e atalhos operacionais.\n16. Exportação CSV compatível com Excel e backup completo em JSON.\n17. Diagnóstico técnico local e exportável sem dados comerciais.\n18. Relatórios liberados após amostra mínima de 10 vendas distribuídas por pelo menos 7 dias.\n')
          replace('PROJECT_STATE.md',
            '- O workspace Lovable continua sem créditos para execução do agente por essa via; não criar projeto/banco alternativo para contornar isso.\n- **Único hardening externo não encerrado:** branch protection/ruleset da `main`. A API do GitHub retornou `403` para rulesets/branch protection no repositório privado pela integração/nível disponível. Isso não é falha da aplicação nem do banco.',
            '- O repositório é público e passou por higienização de histórico, dados demonstrativos e documentação antes da abertura.\n- A `main` está protegida pelo ruleset ativo `main-protection`; mudanças seguem branch → Pull Request → checks obrigatórios → squash merge.\n- `validate` e `database-security` são gates obrigatórios; `mobile-e2e` roda automaticamente em Pull Requests.')

          replace('SECURITY.md',
            'O pipeline deve executar lint, typecheck, scanner de segurança, validação Deno das Edge Functions, testes do domínio, build, auditoria de dependências e testes reais de RLS em Supabase descartável.\n',
            'O pipeline deve executar lint, typecheck, scanner de segurança, validação Deno das Edge Functions, testes do domínio, build, auditoria de dependências e testes reais de RLS em Supabase descartável. Pull Requests também executam regressão mobile com Playwright.\n\n## Governança do repositório\n- A `main` é protegida por ruleset ativo.\n- Mudanças entram por Pull Request e squash merge; force push e exclusão da branch principal são bloqueados.\n- `validate` e `database-security` são checks obrigatórios antes do merge.\n- Dependabot acompanha dependências npm e GitHub Actions; `CODEOWNERS` mantém responsabilidade explícita sobre o código.\n')

          replace('docs/README.md',
            '| [PROJECT_STATE.md](../PROJECT_STATE.md) | estado operacional e histórico técnico consolidado |',
            '| [PROJECT_STATE.md](../PROJECT_STATE.md) | estado operacional e histórico técnico consolidado |\n| [PUBLICATION_NOTES.md](PUBLICATION_NOTES.md) | critérios de sanitização adotados para a versão pública |')
          PY

          cat > .github/pull_request_template.md <<'EOF'
          ## Objetivo
          <!-- Qual problema esta mudança resolve? -->

          ## Mudanças
          <!-- Resuma o que foi alterado. -->

          ## Risco e rollback
          <!-- Informe risco relevante e como desfazer, ou escreva "baixo / revert do PR". -->

          ## Validação
          - [ ] `npm run check` passou quando aplicável
          - [ ] Alterações de banco vieram com migration e regressão em `supabase/tests`
          - [ ] UX foi conferida em mobile quando a interface mudou
          - [ ] Nenhum segredo, dado pessoal, dado de cliente ou receita operacional real foi incluído
          EOF

      - name: Commit documentation polish
        shell: bash
        run: |
          git config user.name 'Kauê Pastrello'
          git config user.email '120512459+kauefsantos@users.noreply.github.com'
          git add README.md PROJECT_STATE.md SECURITY.md docs/README.md .github/pull_request_template.md
          git commit -m 'docs: polish public repository presentation and governance'
          git push origin HEAD:chore/codebase-github-polish
